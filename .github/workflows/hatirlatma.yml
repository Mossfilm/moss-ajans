# Saatlik telefon hatırlatmaları (ücretsiz, GitHub Actions). Gizli değişken: FIREBASE_SERVICE_ACCOUNT
name: Hatırlatmalar
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/hatirlatma.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
